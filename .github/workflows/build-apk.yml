name: Build Privacy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Flutter and Android SDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.android
            ~/.gradle
            ~/.pub-cache
            ~/flutter
            ~/android-sdk
          key: ${{ runner.os }}-dshgo-v1-${{ hashFiles('**/pubspec.lock', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-dshgo-v1-

      - name: Setup Environment and Build
        run: |
          # 1. 安装工具链
          bash tooling/setup-toolchain.sh
          # 2. 加载环境变量（注意：在 GHA 中必须在同一个 run 块中 source 才能生效）
          source tooling/env.sh
          
          # 3. 构建 runtime
          bash runtime/build-runtime.sh arm64-v8a
          
          # 4. 构建 APK（这里去掉了 --no-analytics，因为源码已经干净了，防止脚本不认这个参数报错）
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64 --keep-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-privacy-apk
          path: app/build/app/outputs/flutter-apk/*.apk
