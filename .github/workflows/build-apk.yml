name: Build Privacy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment and Build
        run: |
          bash tooling/setup-toolchain.sh
          source tooling/env.sh
          bash runtime/build-runtime.sh arm64-v8a
          # 注意：这里加上了 --no-analytics 参数（见下方说明）
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64 --keep-daemon --no-analytics

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-privacy-apk
          path: app/build/app/outputs/flutter-apk/*.apk
