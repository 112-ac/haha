name: Build Privacy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 关键修复：告诉 Actions 所有的 run 命令都在 dsh-go 目录下执行
    defaults:
      run:
        working-directory: dsh-go
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Flutter and Android SDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.android
            ~/.gradle
            ~/.pub-cache
            ~/flutter
            ~/android-sdk
          key: ${{ runner.os }}-dshgo-v1-${{ hashFiles('**/pubspec.lock', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-dshgo-v1-

      - name: Setup Environment and Build
        run: |
          bash tooling/setup-toolchain.sh
          source tooling/env.sh
          bash runtime/build-runtime.sh arm64-v8a
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64 --keep-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-privacy-apk
          # 注意：上传产物的路径是相对于仓库根目录的，所以必须带上 dsh-go/
          path: dsh-go/app/build/app/outputs/flutter-apk/*.apk
